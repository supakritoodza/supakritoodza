<rect x="500" y="361" width="560" height="12" rx="6" fill="#1A212C"/>
<rect class="bar" style="animation-delay:0.70s" x="500" y="361" width="12.8" height="12" rx="6" fill="#336791"/>
<text x="1140" y="375" text-anchor="end" font-size="19" font-style="italic" fill="#F5F7FA">1.0%</text></g><g style="animation:rise .5s 0.58s both">
<rect x="40" y="396" width="1120" height="42" rx="6" fill="#121821"/>
