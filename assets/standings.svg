<rect x="500" y="411" width="560" height="12" rx="6" fill="#1A212C"/>
<rect class="bar" style="animation-delay:0.78s" x="500" y="411" width="12.8" height="12" rx="6" fill="#42B883"/>
<text x="1140" y="425" text-anchor="end" font-size="19" font-style="italic" fill="#F5F7FA">1.0%</text></g>

