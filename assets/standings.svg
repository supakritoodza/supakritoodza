<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Language championship standings">
<title>Language championship standings</title>
<defs><pattern id="carbon" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="8" height="8" fill="#0B0E13"/><rect width="4" height="4" fill="#141922"/><rect x="4" y="4" width="4" height="4" fill="#141922"/></pattern>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#0B0E13" stop-opacity="0"/><stop offset="1" stop-color="#0B0E13" stop-opacity=".95"/></linearGradient>
<clipPath id="card"><rect width="1200" height="470" rx="14"/></clipPath>
</defs>
<style>text{font-family:'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif} .mono{font-family:'SF Mono','Menlo','Consolas',monospace} @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar{transform-box:fill-box;transform-origin:left;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<g clip-path="url(#card)">
<rect width="1200" height="470" fill="url(#carbon)"/>

<text class="mono" x="40" y="44" font-size="14" letter-spacing="5" fill="#81C4FF">// CHAMPIONSHIP STANDINGS</text>
<text class="mono" x="44" y="78" font-size="12" letter-spacing="2" fill="#8A94A6">POS</text><text class="mono" x="128" y="78" font-size="12" letter-spacing="2" fill="#8A94A6">ENGINE</text><text class="mono" x="330" y="78" font-size="12" letter-spacing="2" fill="#8A94A6">CLASS</text><text class="mono" x="500" y="78" font-size="12" letter-spacing="2" fill="#8A94A6">SHARE OF COMMITS</text>
<g transform="translate(1040,22)"><rect class="" x="0" y="0" width="18" height="34" fill="#81C4FF" transform="skewX(-20)"/>
