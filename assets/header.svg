<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="SUPAKRIT ODTHON - #11 - FULL-STACK DEVELOPER">
<title>SUPAKRIT ODTHON - #11 - FULL-STACK DEVELOPER</title>
<defs><pattern id="carbon" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="8" height="8" fill="#0B0E13"/><rect width="4" height="4" fill="#141922"/><rect x="4" y="4" width="4" height="4" fill="#141922"/></pattern>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#0B0E13" stop-opacity="0"/><stop offset="1" stop-color="#0B0E13" stop-opacity=".95"/></linearGradient>
<clipPath id="card"><rect width="1200" height="360" rx="14"/></clipPath>
</defs>
<style>text{font-family:'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif} .mono{font-family:'SF Mono','Menlo','Consolas',monospace} @keyframes l0{0%,4%{fill:#2B0A0C}5%,44%{fill:#E7222E}45%,100%{fill:#2B0A0C}}.l0{animation:l0 7s infinite}
@keyframes l1{0%,11%{fill:#2B0A0C}12%,44%{fill:#E7222E}45%,100%{fill:#2B0A0C}}.l1{animation:l1 7s infinite}
@keyframes l2{0%,18%{fill:#2B0A0C}19%,44%{fill:#E7222E}45%,100%{fill:#2B0A0C}}.l2{animation:l2 7s infinite}
@keyframes l3{0%,25%{fill:#2B0A0C}26%,44%{fill:#E7222E}45%,100%{fill:#2B0A0C}}.l3{animation:l3 7s infinite}
@keyframes l4{0%,32%{fill:#2B0A0C}33%,44%{fill:#E7222E}45%,100%{fill:#2B0A0C}}.l4{animation:l4 7s infinite}
@keyframes slide{from{transform:translateX(-900px)}to{transform:translateX(0)}}
.band{animation:slide 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes go{0%,44%{opacity:0}46%,92%{opacity:1}100%{opacity:0}}
.go{animation:go 7s infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.r1{animation:rise .8s .2s both} .r2{animation:rise .8s .45s both} .r3{animation:rise .8s .7s both}
@keyframes speed{0%{transform:translateX(1300px)}100%{transform:translateX(-400px)}}
.sp{animation:speed 1.6s linear infinite}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<g clip-path="url(#card)">
<rect width="1200" height="360" fill="url(#carbon)"/>

<rect class="sp" style="animation-delay:0s" x="0" y="40" width="220" height="2" fill="#81C4FF" opacity=".35"/><rect class="sp" style="animation-delay:0.5s" x="0" y="70" width="140" height="2" fill="#F5F7FA" opacity=".35"/><rect class="sp" style="animation-delay:0.9s" x="0" y="250" width="260" height="2" fill="#81C4FF" opacity=".35"/><rect class="sp" style="animation-delay:0.3s" x="0" y="270" width="120" height="2" fill="#F5F7FA" opacity=".35"/><rect class="sp" style="animation-delay:1.2s" x="0" y="232" width="180" height="2" fill="#E7222E" opacity=".35"/>
<g class="band"><g transform="translate(560,0)"><rect class="" x="120" y="-20" width="46" height="400" fill="#81C4FF" transform="skewX(-20)"/>
<rect class="" x="176" y="-20" width="46" height="400" fill="#16588E" transform="skewX(-20)"/>
<rect class="" x="232" y="-20" width="46" height="400" fill="#E7222E" transform="skewX(-20)"/></g></g>
<rect x="560" width="640" height="360" fill="url(#fade)" opacity=".35"/>
<!-- number plate -->
<g transform="translate(930,70)">
  <rect width="220" height="170" rx="18" fill="#F5F7FA" transform="skewX(-8)"/>
  <rect x="10" y="10" width="200" height="150" rx="12" fill="none" stroke="#0B0E13" stroke-width="3" transform="skewX(-8)"/>
  <text x="96" y="138" text-anchor="middle" font-size="128" font-style="italic" fill="#0B0E13" letter-spacing="-6">11</text>
</g>
<g transform="translate(60,0)">
  <text class="r1 mono" x="0" y="78" font-size="16" fill="#81C4FF" letter-spacing="6">// DRIVER PROFILE</text>
  <text class="r2" x="0" y="150" font-size="64" font-style="italic" fill="#F5F7FA" letter-spacing="1">SUPAKRIT ODTHON</text>
  <g class="r3">
    <rect x="0" y="176" width="8" height="34" fill="#81C4FF"/><rect x="12" y="176" width="8" height="34" fill="#16588E"/><rect x="24" y="176" width="8" height="34" fill="#E7222E"/>
    <text x="48" y="203" font-size="26" font-style="italic" fill="#F5F7FA">FULL-STACK DEVELOPER</text>
    <text class="mono" x="48" y="240" font-size="16" fill="#8A94A6" letter-spacing="3">TEAM LOOKSOCIAL</text>
    <g transform="translate(250,226)"><rect x="0" y="0" width="36" height="4" fill="#A51931"/><rect x="0" y="4" width="36" height="4" fill="#F4F5F8"/><rect x="0" y="8" width="36" height="8" fill="#2D2A4A"/><rect x="0" y="16" width="36" height="4" fill="#F4F5F8"/><rect x="0" y="20" width="36" height="4" fill="#A51931"/></g>
    <text class="mono" x="296" y="245" font-size="16" fill="#8A94A6" letter-spacing="3">THA</text>
  </g>
</g>
<rect x="51" y="290" width="38" height="38" rx="6" fill="#05070A" stroke="#2A3240"/><circle class="l0" cx="70" cy="309" r="13" fill="#2B0A0C"/><rect x="97" y="290" width="38" height="38" rx="6" fill="#05070A" stroke="#2A3240"/><circle class="l1" cx="116" cy="309" r="13" fill="#2B0A0C"/><rect x="143" y="290" width="38" height="38" rx="6" fill="#05070A" stroke="#2A3240"/><circle class="l2" cx="162" cy="309" r="13" fill="#2B0A0C"/><rect x="189" y="290" width="38" height="38" rx="6" fill="#05070A" stroke="#2A3240"/><circle class="l3" cx="208" cy="309" r="13" fill="#2B0A0C"/><rect x="235" y="290" width="38" height="38" rx="6" fill="#05070A" stroke="#2A3240"/><circle class="l4" cx="254" cy="309" r="13" fill="#2B0A0C"/>
<text class="go" x="320" y="318" font-size="22" font-style="italic" fill="#F5F7FA">LIGHTS OUT AND AWAY WE GO</text>
<text class="go" x="320" y="318" font-size="22" font-style="italic" fill="none" stroke="#E7222E" stroke-width=".6" dx="2" dy="2" opacity=".6">LIGHTS OUT AND AWAY WE GO</text>

</g>
<rect x=".5" y=".5" width="1199" height="359" rx="14" fill="none" stroke="#2A3240"/>
</svg>