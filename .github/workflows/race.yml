name: Race track

on:
  schedule:
    - cron: "0 17 * * *" # 00:00 Asia/Bangkok
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/race.py, .github/workflows/race.yml]

permissions:
  contents: write

concurrency:
  group: race-track
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render race track
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/race.py "${{ github.repository_owner }}" assets/race.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add assets/race.svg
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update race track"
          git push
